# Dependency update PRs. Versions are pinned exactly and restore runs in
# --locked-mode (#167), so upstream patches arrive only through these PRs —
# each one regenerates packages.lock.json alongside the version bump.
version: 2
updates:
  - package-ecosystem: nuget
    directory: /
    schedule:
      interval: weekly
    # Default is 5 open PRs per ecosystem. The first run hit that cap exactly,
    # so Microsoft.NET.Test.Sdk, xunit.runner.visualstudio and
    # Nerdbank.MessagePack were silently never proposed — a cap reads as
    # "nothing else is outdated" unless you check by hand.
    open-pull-requests-limit: 15
    groups:
      # Analyzers never ship in the packed tool — batch their bumps.
      analyzers:
        patterns:
          - "*Analyzers*"
          - "FSharp.Analyzers.Build"
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 15
  - package-ecosystem: nuget
    directory: /docs
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
