name: Live FSAC compatibility

on:
  # publish.yml calls this local reusable workflow from the tag commit and makes
  # publication depend on its aggregate matrix result. This is the tag gate;
  # do not replace it with a detached workflow_run correlation.
  workflow_call:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "global.json"
      - "Directory.Build.props"
      - "FsLangMcp.fsproj"
      - "packages.lock.json"
      - "dotnet-tools.json"
      - "*.fs"
      - "scripts/runtime-toolchain.py"
      - "scripts/verify-package-version.py"
      - "scripts/tests/**"
      - ".github/workflows/live-fsac.yml"
  pull_request:
    branches: [main]
    paths:
      - "global.json"
      - "Directory.Build.props"
      - "FsLangMcp.fsproj"
      - "packages.lock.json"
      - "dotnet-tools.json"
      - "*.fs"
      - "scripts/runtime-toolchain.py"
      - "scripts/verify-package-version.py"
      - "scripts/tests/**"
      - ".github/workflows/live-fsac.yml"

concurrency:
  group: live-fsac-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  live-fsac:
    name: ${{ matrix.os }} / pinned runtime tools
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - name: Checkout without persisted credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup exact .NET SDK
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: "10.0.400"

      - name: Verify exact SDK selection
        shell: pwsh
        run: |
          $actual = dotnet --version
          if ($actual -ne "10.0.400") {
            throw "Expected .NET SDK 10.0.400, got $actual"
          }

      - name: Resolve the exact live build version
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $projectVersion = (dotnet msbuild FsLangMcp.fsproj -nologo -getProperty:Version).Trim()
          $version = $projectVersion

          if ($env:GITHUB_REF_TYPE -eq "tag") {
            if (-not $env:GITHUB_REF_NAME.StartsWith("v")) {
              throw "Tag '$env:GITHUB_REF_NAME' is not a v* release tag."
            }
            $version = $env:GITHUB_REF_NAME.Substring(1)
          }

          if ($version -notmatch '^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?$') {
            throw "Live build Version is not exact SemVer: $version"
          }

          "FSLANGMCP_LIVE_VERSION=$version" | Out-File `
            -FilePath $env:GITHUB_ENV `
            -Encoding utf8 `
            -Append

      - name: Restore locked dependencies
        run: dotnet restore FsLangMcp.fsproj --locked-mode

      - name: Build FsLangMCP
        shell: pwsh
        run: |
          dotnet build FsLangMcp.fsproj `
            --configuration Release `
            --no-restore `
            --warnaserror `
            -p:Version="$env:FSLANGMCP_LIVE_VERSION" `
            -p:PackageVersion="$env:FSLANGMCP_LIVE_VERSION" `
            -p:ContinuousIntegrationBuild=true

      - name: Pack and install the exact FsLangMCP artifact
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $packageDirectory = Join-Path "${{ runner.temp }}" "fslangmcp-package"
          $installedToolDirectory = Join-Path "${{ runner.temp }}" "fslangmcp-installed-tool"
          $nugetConfig = Join-Path "${{ runner.temp }}" "fslangmcp-package.NuGet.config"
          $version = $env:FSLANGMCP_LIVE_VERSION

          dotnet pack FsLangMcp.fsproj `
            --configuration Release `
            --no-build `
            --no-restore `
            -p:Version="$version" `
            -p:PackageVersion="$version" `
            -o "$packageDirectory"

          $packages = @(Get-ChildItem -Path $packageDirectory -Filter "FsLangMcp.*.nupkg" -File)
          if ($packages.Count -ne 1) {
            throw "Expected exactly one FsLangMcp nupkg, found $($packages.Count)."
          }
          $packagePath = $packages[0].FullName

          $packageSource = (Resolve-Path $packageDirectory).Path
          @"
          <?xml version="1.0" encoding="utf-8"?>
          <configuration>
            <packageSources>
              <clear />
              <add key="live-package" value="$packageSource" />
            </packageSources>
          </configuration>
          "@ | Set-Content -Path $nugetConfig -Encoding utf8

          dotnet tool install `
            --tool-path "$installedToolDirectory" `
            --configfile "$nugetConfig" `
            --no-http-cache `
            FsLangMcp `
            --version "$version"

          $installedTool = if ($IsWindows) {
            Join-Path $installedToolDirectory "fslangmcp.exe"
          } else {
            Join-Path $installedToolDirectory "fslangmcp"
          }

          if (-not (Test-Path -Path $installedTool -PathType Leaf)) {
            throw "Installed package did not create $installedTool"
          }

          $installedVersion = (& $installedTool --version).Trim()
          if ($installedVersion -ne $version) {
            throw "Installed tool reports $installedVersion; expected $version."
          }

          python scripts/verify-package-version.py `
            --package "$packagePath" `
            --expected-version "$version" `
            --installed-tool "$installedTool"

          "FSLANGMCP_LIVE_SERVER=$installedTool" | Out-File `
            -FilePath $env:GITHUB_ENV `
            -Encoding utf8 `
            -Append

      - name: Prove the packaged bootstrap contract outside the local manifest
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $bootstrapHome = Join-Path "${{ runner.temp }}" "fslangmcp-bootstrap-home"
          $bootstrapPackages = Join-Path $bootstrapHome "nuget-packages"
          $globalTools = Join-Path (Join-Path $bootstrapHome ".dotnet") "tools"
          $workDirectory = Join-Path "${{ runner.temp }}" "fslangmcp-bootstrap-smoke"
          $env:DOTNET_CLI_HOME = $bootstrapHome
          $env:NUGET_PACKAGES = $bootstrapPackages
          $env:DOTNET_CLI_TELEMETRY_OPTOUT = "1"
          $env:DOTNET_SKIP_FIRST_TIME_EXPERIENCE = "1"

          & "${{ env.FSLANGMCP_LIVE_SERVER }}" --bootstrap-tools
          if ($LASTEXITCODE -ne 0) {
            throw "Packaged --bootstrap-tools exited with $LASTEXITCODE."
          }

          $manifest = Get-Content -Raw dotnet-tools.json | ConvertFrom-Json
          $requiredTools = @{
            "fantomas" = "fantomas"
            "fsautocomplete" = "fsautocomplete"
            "ionide.projinfo.tool" = "proj-info"
          }

          foreach ($packageId in $requiredTools.Keys) {
            $pin = $manifest.tools.$packageId
            if ($null -eq $pin -or $pin.rollForward -ne $false) {
              throw "Manifest does not contain an exact non-rolling pin for $packageId."
            }
            $store = Join-Path $globalTools ".store/$($packageId.ToLowerInvariant())/$($pin.version)"
            if (-not (Test-Path -Path $store -PathType Container)) {
              throw "Packaged bootstrap did not install exact $packageId $($pin.version)."
            }
          }

          $env:PATH = $globalTools + [IO.Path]::PathSeparator + $env:PATH
          New-Item -ItemType Directory -Force -Path $workDirectory | Out-Null
          Push-Location $workDirectory
          try {
            if (Test-Path -Path "dotnet-tools.json") {
              throw "Bootstrap smoke directory unexpectedly contains a local tool manifest."
            }

            @(
              '<Project Sdk="Microsoft.NET.Sdk">'
              '  <PropertyGroup>'
              '    <TargetFramework>net10.0</TargetFramework>'
              '  </PropertyGroup>'
              '  <ItemGroup>'
              '    <Compile Include="Smoke.fs" />'
              '  </ItemGroup>'
              '</Project>'
            ) | Set-Content -Path "Smoke.fsproj" -Encoding utf8
            "module BootstrapSmoke`n`nlet addOne value= value+1`n" |
              Set-Content -Path "Smoke.fs" -Encoding utf8

            $fantomasVersion = (dotnet fantomas --version).Trim()
            $expectedFantomas = $manifest.tools.fantomas.version
            if ($fantomasVersion -notmatch "^Fantomas v$([regex]::Escape($expectedFantomas))(\+.*)?$") {
              throw "dotnet fantomas resolved $fantomasVersion; expected $expectedFantomas."
            }

            dotnet fantomas "Smoke.fs"
            if ($LASTEXITCODE -ne 0) {
              throw "dotnet fantomas formatting exited with $LASTEXITCODE."
            }
            $formatted = Get-Content -Raw "Smoke.fs"
            if ($formatted -notmatch "let addOne value = value \+ 1") {
              throw "Bootstrapped dotnet-fantomas alias did not format the smoke source."
            }
          }
          finally {
            Pop-Location
          }

      - name: Install exact runtime toolchain
        run: python scripts/runtime-toolchain.py install --tool-path "${{ runner.temp }}/fslangmcp-runtime-tools"

      - name: Run release-smoke contract self-tests
        run: python -m unittest discover -s scripts/tests -p "test_*.py"

      - name: Exercise the installed package through live FSAC and ProjInfo
        run: python scripts/runtime-toolchain.py smoke --tool-path "${{ runner.temp }}/fslangmcp-runtime-tools" --server "${{ env.FSLANGMCP_LIVE_SERVER }}" --project FsLangMcp.fsproj
