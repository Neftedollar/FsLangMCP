name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    env:
      DOTNET_INSTALL_DIR: ${{ github.workspace }}/.dotnet-exact
      DOTNET_MULTILEVEL_LOOKUP: '0'

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: '10.0.400'

      - name: Verify pinned SDK
        shell: bash
        run: |
          set -euo pipefail
          test "$(dotnet --version)" = "10.0.400"

      - name: Test release-smoke contracts
        run: python -m unittest discover -s scripts/tests -p "test_*.py"

      - name: Restore
        run: dotnet restore FsLangMcp.slnx --locked-mode

      - name: Build
        run: dotnet build FsLangMcp.slnx --no-restore --configuration Release --warnaserror

      # Needs the built assembly, so it cannot ride the pre-build "release-smoke
      # contracts" step above — that discovery run skips this module by design.
      # Guards the #192 acceptance criterion over the real stdio transport.
      - name: Test SDK-pin pre-flight end to end
        env:
          FSLANGMCP_SERVER_DLL: bin/Release/net10.0/FsLangMcp.dll
        run: python -m unittest -v scripts.tests.test_sdk_pin_preflight_e2e

      - name: Test (with coverage)
        # coverlet.msbuild instruments FsLangMcp.dll via the ProjectReference graph (ADR-0001).
        # IncludeTestAssembly is no longer needed — prod and test code are in separate assemblies.
        run: |
          dotnet test FsLangMcp.slnx --no-build --no-restore --configuration Release \
            --blame-hang \
            --blame-hang-timeout 3m \
            --blame-hang-dump-type none \
            --logger "console;verbosity=normal" \
            /p:CollectCoverage=true \
            /p:CoverletOutputFormat=cobertura \
            /p:CoverletOutput=./coverage/

      - name: Upload test hang diagnostics
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: test-hang-diagnostics
          path: '**/TestResults/**'
          if-no-files-found: warn

      - name: Coverage gate (≥ 54% line)
        run: |
          set -e
          # Find the cobertura xml produced by coverlet.msbuild
          COVERAGE_FILE=$(find . -name 'coverage.cobertura.xml' | head -1)
          if [ -z "$COVERAGE_FILE" ]; then
            echo "::error::No coverage file produced"; exit 1
          fi
          # Extract line-rate (decimal 0..1) from the root <coverage> element
          LINE_RATE=$(grep -oP 'line-rate="[0-9.]+"' "$COVERAGE_FILE" | head -1 | grep -oP '[0-9.]+')
          PERCENT=$(awk -v r="$LINE_RATE" 'BEGIN{printf "%.1f", r*100}')
          echo "Line coverage: ${PERCENT}%"
          # Threshold recalibrated to 54% after measuring the post-ADR-0001 baseline at
          # ~54.8% (FsLangMcp.dll only — test-file lines are no longer counted as covered).
          # The original 55% target was set without measuring actual coverage. Raising the
          # threshold back is a separate follow-up once LspBridge.fs and Program.fs get
          # integration test coverage.
          awk -v r="$LINE_RATE" 'BEGIN{exit !(r >= 0.54)}' || {
            echo "::error::Coverage ${PERCENT}% < 54% threshold"; exit 1
          }

      - name: Upload coverage artifact
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-cobertura
          path: '**/coverage.cobertura.xml'
          if-no-files-found: warn

  minimum-sdk:
    name: Minimum SDK (10.0.100)
    runs-on: ubuntu-latest
    env:
      DOTNET_INSTALL_DIR: ${{ github.workspace }}/.dotnet-minimum
      DOTNET_MULTILEVEL_LOOKUP: '0'

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup minimum .NET SDK
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: '10.0.100'

      - name: Verify minimum SDK selection
        shell: bash
        run: |
          set -euo pipefail
          test "$(dotnet --version)" = "10.0.100"

      - name: Restore locked dependencies
        run: dotnet restore FsLangMcp.slnx --locked-mode

      - name: Build with minimum SDK
        run: dotnet build FsLangMcp.slnx --no-restore --configuration Release --warnaserror

      - name: Test with minimum SDK
        run: dotnet test FsLangMcp.slnx --no-build --no-restore --configuration Release
