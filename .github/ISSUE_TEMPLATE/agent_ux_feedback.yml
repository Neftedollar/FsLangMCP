name: 🤖 Agent UX behavior
description: Report one reproducible agent-facing behavior from a real task
labels: ["ux-feedback"]
body:
  - type: markdown
    attributes:
      value: |
        This project lives or dies on whether agents reach for it **instead of `grep`**. Please keep this issue bounded
        to **one reproducible behavior**. File unrelated bugs/requests separately; add evidence to an existing issue when
        it already tracks this exact behavior. Positive/non-actionable notes can stay in the originating task report.
  - type: input
    id: version
    attributes:
      label: FsLangMCP version
      description: From the `fslangmcp_version` tool. (In-session MCP = the **installed** tool, not your local build.)
      placeholder: "0.12.1"
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Task & codebase
      description: What was the agent doing, on what kind of F# project (size, single vs multi-project, restored or not)?
    validations:
      required: true
  - type: textarea
    id: friction
    attributes:
      label: One observed behavior
      description: Include the request payload, observed response/timing, and where the agent fell back to rg/build. Do not combine unrelated observations.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What concrete response, latency, or capability would close this issue?
    validations:
      required: true
  - type: textarea
    id: guardrails
    attributes:
      label: Relevant non-regressions
      description: Optional — what nearby behavior already worked and must not regress while fixing this issue?
