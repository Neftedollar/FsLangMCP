name: 🤖 Agent UX behavior
description: Report one reproducible agent-facing behavior from a real task
labels: ["ux-feedback"]
body:
  - type: markdown
    attributes:
      value: |
        This project lives or dies on whether agents reach for it **instead of `grep`**. Please keep this issue bounded
        to **one reproducible behavior**. File unrelated bugs/requests separately; add evidence to an existing issue when
        it already tracks this exact behavior. Positive/non-actionable notes can stay in the originating task report.
  - type: input
    id: version
    attributes:
      label: Running FsLangMCP version
      description: |
        Call `fslangmcp_version` in the MCP session that reproduced the issue and paste the version.
        Updating the installed tool does not update an already-running server. After updating, reconnect and check again.
        If the server cannot start, say so and report `fslangmcp --version` instead. For a local build, include the commit SHA.
      placeholder: "Version from the affected MCP session"
    validations:
      required: true
  - type: input
    id: installed-version
    attributes:
      label: Installed FsLangMCP version (if different)
      description: |
        Run `fslangmcp --version` using the executable configured in your MCP client.
        This reports the on-disk version, which can differ from the version in a running session.
      placeholder: "Leave blank if it matches the running version"
  - type: textarea
    id: context
    attributes:
      label: Task & codebase
      description: What was the agent doing, on what kind of F# project (size, single vs multi-project, restored or not)?
    validations:
      required: true
  - type: textarea
    id: friction
    attributes:
      label: One observed behavior
      description: Include the request payload, observed response/timing, and where the agent fell back to rg/build. Do not combine unrelated observations.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What concrete response, latency, or capability would close this issue?
    validations:
      required: true
  - type: textarea
    id: guardrails
    attributes:
      label: Relevant non-regressions
      description: Optional — what nearby behavior already worked and must not regress while fixing this issue?
