name: 🐞 Bug report
description: Something in FsLangMCP behaves incorrectly (wrong result, crash, confusing error).
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for filing a report — a clear repro makes a fix dramatically faster.
  - type: input
    id: version
    attributes:
      label: Running FsLangMCP version
      description: |
        Call `fslangmcp_version` in the MCP session that reproduced the issue and paste the version.
        Updating the installed tool does not update an already-running server. After updating, reconnect and check again.
        If the server cannot start, say so and report `fslangmcp --version` instead. For a local build, include the commit SHA.
      placeholder: "Version from the affected MCP session"
    validations:
      required: true
  - type: input
    id: installed-version
    attributes:
      label: Installed FsLangMCP version (if different)
      description: |
        Run `fslangmcp --version` using the executable configured in your MCP client.
        This reports the on-disk version, which can differ from the version in a running session.
      placeholder: "Leave blank if it matches the running version"
  - type: dropdown
    id: client
    attributes:
      label: MCP client
      options:
        - Claude Code
        - Cursor
        - Codex
        - GitHub Copilot
        - Other / direct stdio
    validations:
      required: true
  - type: input
    id: tool
    attributes:
      label: Tool involved
      description: Which FsLangMCP tool? (e.g. `find`, `check`, `set_project`)
      placeholder: "find"
  - type: textarea
    id: repro
    attributes:
      label: Reproduction
      description: Exact tool name + JSON arguments, the project shape (single .fsproj / .slnx / multi-project), and whether it was `dotnet restore`d.
      placeholder: |
        1. set_project { "projectPath": "/path/MySolution.slnx" }
        2. find { "query": "MyType" }
      render: text
    validations:
      required: true
  - type: textarea
    id: expected-actual
    attributes:
      label: Expected vs actual
      description: What you expected, and what actually came back (paste the relevant JSON, trimmed).
    validations:
      required: true
  - type: textarea
    id: env
    attributes:
      label: Environment
      description: OS, .NET SDK version (`dotnet --version`), and whether `fslangmcp --bootstrap-tools` was run.
